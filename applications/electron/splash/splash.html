<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kath</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      user-select: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .splash-artwork {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      -webkit-user-drag: none;
    }

    /*
      The artwork already contains the loading-bar track. This overlay adds a
      moving cyan highlight so startup visibly remains active while Theia loads.
      Percentages keep the animation aligned when the 960x540 splash is scaled.
    */
    .loading-track {
      position: absolute;
      left: 38.1%;
      bottom: 5.35%;
      width: 23.75%;
      height: 0.72%;
      min-height: 3px;
      overflow: hidden;
      border-radius: 999px;
      pointer-events: none;
    }

    .loading-highlight {
      position: absolute;
      top: 0;
      left: -32%;
      width: 32%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(
        90deg,
        rgba(0, 179, 255, 0),
        rgba(0, 190, 255, 0.70) 25%,
        rgba(122, 225, 255, 1) 50%,
        rgba(0, 190, 255, 0.70) 75%,
        rgba(0, 179, 255, 0)
      );
      box-shadow: 0 0 8px rgba(0, 190, 255, 0.95);
      animation: inu-loading 1.35s linear infinite;
    }

    @keyframes inu-loading {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(412.5%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loading-highlight {
        left: 34%;
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="splash" role="img" aria-label="Kath loading">
    <img class="splash-artwork" src="./kath-splash.png" alt="">
    <div class="loading-track" aria-hidden="true">
      <div class="loading-highlight"></div>
    </div>
  </div>
</body>
</html>
